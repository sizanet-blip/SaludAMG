name: salud_amg
description: SaludAMG — seguimiento personal de tensión arterial, pulso y peso.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  fl_chart: ^0.70.2
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.0
  health: ^13.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdf: ^3.11.0
  printing: ^5.14.0
  share_plus: ^13.3.1
  timezone: ^0.10.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  file_picker: ^13.1.0
  encrypt: ^5.0.3
  http: ^1.5.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/saludamg-launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/saludamg-launcher-foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/branding/saludamg-app-icon.png
    - assets/branding/saludamg-app-icon-foreground.png
    - assets/branding/saludamg-wordmark.png
